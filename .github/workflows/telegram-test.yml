# Sends a test message to Jabir's Telegram using both secrets (same path as the daily report).
name: telegram-test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: >
          uv run python -m agent.notify.telegram
          "🎉 Hi Jabir! The Instagram growth repo is connected to this bot.
          Post previews (✅/❌) and comment → DM alerts will come from here."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
