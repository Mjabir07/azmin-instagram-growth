# Content publisher: reads ✅/❌ taps + clips from Telegram, sends new drafts for approval,
# and posts APPROVED items to Instagram + Facebook when their time comes.
# Live posting needs config/publishing.yaml live: true or the repo variable PUBLISH_LIVE=true; until then it only
# reports (dry run), and comment -> DM only reports too.
# Content only: Meta ads (reports, launches) run in Mjabir07/azmin-digital-ads-agent.
#
# MIGRATION: the schedule, push and Cloudflare triggers stay off until cutover day, so this repo and the ads repo
# never both post or read Telegram. Until then it only runs when started by hand (Actions tab -> Run workflow).
# At cutover add back:
#   schedule: [{cron: "*/5 * * * *"}]
#   push: {paths: [marketing/queue/**]}
#   repository_dispatch: {types: [publish]}
name: publisher

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  publish:
    # Only the main branch talks to Telegram/Meta, so a side branch can never double-post or steal button taps.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
    steps:
      # Check out the branch tip, not the commit that triggered the run: a run queued behind another one
      # must see the queue state that run just saved, or it re-sends the same Telegram preview.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Read Telegram (button taps + clips)
        run: uv run python -m agent.media.collect --quiet
      - name: Send new drafts for approval
        run: uv run python -m agent.social.approvals
      - name: Publish approved posts that are due
        run: uv run python -m agent.social.publish
      - name: Comment keyword -> guide by DM (config/comment-dm.yaml)
        run: uv run python -m agent.social.comment_dm
        continue-on-error: true
      - name: Save queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/queue media/inbox marketing/state
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Publisher: update queue"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
