<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter Tight";src:url(fonts/InterTight.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-400i.woff2) format("woff2");font-style:italic}
html,body{margin:0;background:#F4F1EA} canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// AZMIN pendulum wipe: a badge on a string swings across the headline; the string is the wipe edge, so the word
// behind the string is the new one and the word ahead is the old one. Deterministic draw(t) for render.js.
const W = 1080, H = 1920, C = document.getElementById('c'), X = C.getContext('2d');
const INK = '#0B0B0C', BLUE = '#0062F5', PAPER = '#F4F1EA';
// words: [line1, line2, blue?]. Service words alternate with the call to action.
const CTA = ['COMMENT', 'SWING', true];
const WORDS = [['SCROLL', 'WEBSITES', false], CTA, ['LAUNCH', 'PAGES', false], CTA, ['AI', 'CHATBOTS', false], CTA, ['BOOKING', 'SYSTEMS', false], CTA];
const PIV = [540, -420], LEN = 1450, AMP = 0.3, HALF = 1.0;   // pivot, string length to badge centre, amplitude (rad), half-swing (s)
const T0 = 0.35, SWINGS = WORDS.length - 1, TEND = T0 + SWINGS * HALF;     // swinging part
const END = 12.0;
const logo = new Image(); logo.src = 'img/logo.png';
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lin = (t, a, b) => cl((t - a) / (b - a));
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, eOut = p => 1 - Math.pow(1 - p, 3);
const eBack = p => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
// angle: starts at -AMP, each half-swing goes to the other side (cosine ease = real pendulum feel); after the last
// swing it settles to 0 with a small damped wobble.
function angle(t) {
  if (t < T0) return -AMP;
  if (t < TEND) { const k = Math.floor((t - T0) / HALF), p = (t - T0 - k * HALF) / HALF, from = k % 2 ? AMP : -AMP;
    return from * Math.cos(Math.PI * p); }
  const s = t - TEND, last = SWINGS % 2 ? AMP : -AMP; return last * Math.exp(-s * 2.2) * Math.cos(s * 6.5);
}
function wordIndex(t) { return t < T0 ? 0 : Math.min(SWINGS, Math.floor((t - T0) / HALF)); }
function headline(w, y) {
  X.textAlign = 'center'; X.textBaseline = 'middle'; X.font = "900 134px \"Inter Tight\"";
  X.save(); X.shadowColor = 'rgba(11,11,12,0.18)'; X.shadowBlur = 18; X.shadowOffsetY = 10;
  X.fillStyle = w[2] ? BLUE : INK; X.fillText(w[0], 540, y - 70); X.fillText(w[1], 540, y + 70); X.restore();
}
function sideClip(theta, side) { // half-plane on one side of the string line (through the pivot at angle theta)
  const dx = Math.sin(theta), dy = Math.cos(theta), far = 6000, nx = dy * side, ny = -dx * side;
  X.beginPath(); X.moveTo(PIV[0] - dx * far, PIV[1] - dy * far); X.lineTo(PIV[0] + dx * far, PIV[1] + dy * far);
  X.lineTo(PIV[0] + dx * far + nx * far, PIV[1] + dy * far + ny * far); X.lineTo(PIV[0] - dx * far + nx * far, PIV[1] - dy * far + ny * far);
  X.closePath(); X.clip();
}
function badge(x, y, r) {
  X.save(); X.shadowColor = 'rgba(7,26,61,0.28)'; X.shadowBlur = 40; X.shadowOffsetY = 18;
  X.beginPath(); X.arc(x, y, r, 0, 7); X.fillStyle = '#FFFFFF'; X.fill(); X.restore();
  X.beginPath(); X.arc(x, y, r - 8, 0, 7); X.lineWidth = 3; X.strokeStyle = 'rgba(11,11,12,0.10)'; X.stroke();
  if (logo.complete) X.drawImage(logo, x - r * 0.62, y - r * 0.62, r * 1.24, r * 1.24);
}
window.draw = t => {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.fillStyle = PAPER; X.fillRect(0, 0, W, H);
  const g = X.createRadialGradient(540, 700, 100, 540, 900, 1200); g.addColorStop(0, 'rgba(255,255,255,0.7)'); g.addColorStop(1, 'rgba(255,255,255,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
  const th = angle(t), fin = lin(t, TEND + 0.9, TEND + 1.6), hy = 820;
  // brand row + footer
  X.globalAlpha = 1 - fin; X.textAlign = 'center'; X.textBaseline = 'middle';
  X.drawImage(logo, 540 - 128, 318, 36, 36); X.font = '700 30px "Inter Tight"'; X.fillStyle = INK; X.textAlign = 'left'; X.fillText('azmin_digital', 540 - 82, 337);
  X.textAlign = 'center'; X.font = '700 24px "Inter Tight"'; X.fillStyle = 'rgba(11,11,12,0.55)'; X.fillText('WEBSITES  •  AI  •  MOTION', 540, 1500);
  // headline wipe
  const k = wordIndex(t), swinging = t >= T0 && t < TEND;
  if (!swinging) headline(WORDS[k], hy);
  else { const dir = k % 2 ? -1 : 1;           // even half-swings move left->right
    X.save(); sideClip(th, -dir); headline(WORDS[k + 1], hy); X.restore();   // behind the string: new word
    X.save(); sideClip(th, dir); headline(WORDS[k], hy); X.restore(); }      // ahead of the string: old word
  X.globalAlpha = 1;
  // string + badge
  const bx0 = PIV[0] + Math.sin(th) * LEN, by0 = PIV[1] + Math.cos(th) * LEN, e = eInOut(fin);
  const bx = bx0 + (540 - bx0) * e, by = by0 + (1000 - by0) * e, r = 92 + 40 * e;
  X.save(); X.globalAlpha = 1 - fin; X.strokeStyle = INK; X.lineWidth = 6; X.lineCap = 'round';
  X.beginPath(); X.moveTo(PIV[0], PIV[1]); X.lineTo(bx0, by0); X.stroke(); X.restore();
  badge(bx, by, r);
  // end card
  if (fin > 0) { const p = eBack(lin(t, TEND + 1.3, TEND + 1.8)); X.save(); X.globalAlpha = cl(p);
    X.font = '800 64px "Inter Tight"'; X.fillStyle = INK; X.textAlign = 'center'; X.fillText('@azmin_digital', 540, 1205 + (1 - p) * 30);
    X.font = 'italic 400 58px "Instrument Serif"'; X.fillStyle = BLUE; X.fillText('comment SWING for the free guide', 540, 1295 + (1 - p) * 30);
    X.restore(); }
};
window.SWING_TIMES = Array.from({ length: SWINGS }, (_, i) => +(T0 + i * HALF + 0.12).toFixed(3));
window.END = END;
window.ready = (async () => { await document.fonts.load('900 148px "Inter Tight"'); await document.fonts.load('italic 58px "Instrument Serif"'); await document.fonts.ready; await logo.decode(); window.draw(0); return true; })();
</script></body></html>
